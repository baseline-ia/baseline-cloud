# docker compose up -d
# Production-shape: postgres + cloud service with healthcheck.
# Persistent data: postgres volume survives container restarts.
services:
  postgres:
    image: postgres:16-alpine
    container_name: baseline-cloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - baseline-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Expose only on localhost for safety; remove the ports mapping if running
    # behind a reverse proxy and the cloud service connects over the compose network.
    ports:
      - "127.0.0.1:5432:5432"

  cloud:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: baseline-cloud:latest
    container_name: baseline-cloud
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3007:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL}"
      # CHANGE THESE — generate with: openssl rand -base64 48
      JWT_SECRET: "${JWT_SECRET}"
      TOKEN_PEPPER: "${TOKEN_PEPPER}"
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Set to false when serving over plain HTTP (no TLS termination)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  baseline-pg:
    name: baseline-cloud-postgres-data
